<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>品名リスト｜株式会社ながたに</title>
<link rel="stylesheet" href="css/style.css">
<style>
  .inline-form { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
  .inline-form input { padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; font-family: inherit; font-size: 13px; }
  .del-link { color: #dc2626; background: none; border: none; cursor: pointer; font-size: 12px; padding: 0; font-family: inherit; }
</style>
</head>
<body>

<header class="topbar">
  <h1>📋 品名リスト（箱種）</h1>
  <nav>
    <a class="btn btn-small" href="haisya.html">← 配車メモ入力に戻る</a>
    <a class="btn btn-small" href="destinations.html">配送先リスト</a>
    <button class="btn btn-small" id="logout-btn">ログアウト</button>
  </nav>
</header>

<div class="container">
  <div class="card">
    <div class="section-title" style="margin-top:0;">品名（箱種）一覧</div>
    <p style="font-size:12px;color:#94a3b8;margin-top:-4px;">「既定表示」をONにしたものは、配車メモの表で最初から行として表示されます。</p>
    <div class="table-wrap">
      <table>
        <thead><tr><th>品名（箱種）</th><th style="width:100px;">既定表示</th><th style="width:60px;"></th></tr></thead>
        <tbody id="list-body"></tbody>
      </table>
    </div>
    <div class="inline-form">
      <input id="new-name" placeholder="新しい品名（例: マグロロイン）" style="min-width:220px;">
      <button class="btn btn-primary btn-small" id="add-btn">＋ 追加</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script>
(function () {
  "use strict";
  var items = [];

  function esc(s) {
    return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  async function init() {
    var profile = await requireProfileIn(["haisya", "office"]);
    if (!profile) return;
    document.getElementById("logout-btn").addEventListener("click", signOut);
    document.getElementById("add-btn").addEventListener("click", addItem);
    document.getElementById("list-body").addEventListener("click", onDelete);
    document.getElementById("list-body").addEventListener("change", onToggleDefault);
    await load();
  }

  async function load() {
    var { data, error } = await supabaseClient.from("box_types").select("*").order("sort_order").order("name");
    if (error) { alert("取得に失敗しました: " + error.message); return; }
    items = data || [];
    render();
  }

  function render() {
    var tbody = document.getElementById("list-body");
    if (items.length === 0) {
      tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;color:#94a3b8;">品名がまだ登録されていません</td></tr>';
      return;
    }
    tbody.innerHTML = items.map(function (b) {
      return (
        '<tr data-id="' + b.id + '">' +
          "<td>" + esc(b.name) + "</td>" +
          '<td style="text-align:center;"><input type="checkbox" data-field="is_default"' + (b.is_default ? " checked" : "") + "></td>" +
          '<td><button class="del-link" data-delete="' + b.id + '">削除</button></td>' +
        "</tr>"
      );
    }).join("");
  }

  async function addItem() {
    var input = document.getElementById("new-name");
    var name = input.value.trim();
    if (!name) return;
    var { error } = await supabaseClient.from("box_types").insert({ name: name, sort_order: items.length + 1 });
    if (error) { alert("追加に失敗しました: " + error.message); return; }
    input.value = "";
    await load();
  }

  async function onToggleDefault(e) {
    if (e.target.getAttribute("data-field") !== "is_default") return;
    var id = e.target.closest("tr").getAttribute("data-id");
    var { error } = await supabaseClient.from("box_types").update({ is_default: e.target.checked }).eq("id", id);
    if (error) { alert("更新に失敗しました: " + error.message); }
  }

  async function onDelete(e) {
    var id = e.target.getAttribute("data-delete");
    if (!id) return;
    if (!confirm("この品名を削除しますか？")) return;
    var { error } = await supabaseClient.from("box_types").delete().eq("id", id);
    if (error) { alert("削除に失敗しました: " + error.message); return; }
    await load();
  }

  init();
})();
</script>
</body>
</html>
